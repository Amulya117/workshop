    const { useState, useEffect, useRef } = React;

    // --- Matrix Dot Grid Canvas Component ---
    const MatrixGridCanvas = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const mouse = {
          x: -1000,
          y: -1000,
          targetX: -1000,
          targetY: -1000,
          radius: 190,
          active: false,
        };

        const spacing = 38;
        let cols = Math.ceil(width / spacing) + 2;
        let rows = Math.ceil(height / spacing) + 2;

        const handleResize = () => {
          const dpr = window.devicePixelRatio || 1;
          width = window.innerWidth;
          height = window.innerHeight;
          canvas.width = width * dpr;
          canvas.height = height * dpr;
          canvas.style.width = `${width}px`;
          canvas.style.height = `${height}px`;
          ctx.scale(dpr, dpr);

          cols = Math.ceil(width / spacing) + 2;
          rows = Math.ceil(height / spacing) + 2;
        };

        handleResize();
        window.addEventListener('resize', handleResize);

        const handleMouseMove = (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.targetX = e.clientX - rect.left;
          mouse.targetY = e.clientY - rect.top;
          mouse.active = true;
        };

        const handleMouseLeave = () => {
          mouse.active = false;
          mouse.targetX = -1000;
          mouse.targetY = -1000;
        };

        const handleTouchMove = (e) => {
          if (e.touches.length > 0) {
            const rect = canvas.getBoundingClientRect();
            mouse.targetX = e.touches[0].clientX - rect.left;
            mouse.targetY = e.touches[0].clientY - rect.top;
            mouse.active = true;
          }
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);
        window.addEventListener('touchmove', handleTouchMove, { passive: true });
        window.addEventListener('touchend', handleMouseLeave);

        let frame = 0;

        const render = () => {
          frame += 0.02;
          mouse.x += (mouse.targetX - mouse.x) * 0.08;
          mouse.y += (mouse.targetY - mouse.y) * 0.08;

          ctx.clearRect(0, 0, width, height);

          const centerX = width / 2;
          const centerY = height / 2;
          const tiltX = mouse.active ? ((mouse.x - centerX) / centerX) * 8 : 0;
          const tiltY = mouse.active ? ((mouse.y - centerY) / centerY) * 8 : 0;

          for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
              const originX = (i - 1) * spacing;
              const originY = (j - 1) * spacing;

              const ambientWave =
                Math.sin(originX * 0.008 + frame) * Math.cos(originY * 0.008 + frame) * 3;

              const dx = mouse.x - originX;
              const dy = mouse.y - originY;
              const dist = Math.sqrt(dx * dx + dy * dy);

              let posX = originX + tiltX * 0.3;
              let posY = originY + tiltY * 0.3 + ambientWave;
              let dotRadius = 1.2;
              let alpha = 0.2;
              let isNeon = false;

              if (mouse.active && dist < mouse.radius) {
                const force = 1 - dist / mouse.radius;
                const ripple = Math.sin(dist * 0.06 - frame * 4) * 8 * force;
                const angle = Math.atan2(dy, dx);

                posX -= Math.cos(angle) * (force * 14 + ripple);
                posY -= Math.sin(angle) * (force * 14 + ripple);

                dotRadius = 1.2 + force * 2.2;
                alpha = 0.25 + force * 0.75;
                isNeon = true;
              }

              ctx.beginPath();
              ctx.arc(posX, posY, Math.max(0.6, dotRadius), 0, Math.PI * 2);

              if (isNeon) {
                const glowRatio = 1 - dist / mouse.radius;
                if (glowRatio > 0.45) {
                  ctx.fillStyle = `rgba(163, 230, 53, ${alpha})`;
                  ctx.shadowColor = '#10b981';
                  ctx.shadowBlur = 6;
                } else {
                  ctx.fillStyle = `rgba(16, 185, 129, ${alpha})`;
                  ctx.shadowColor = '#059669';
                  ctx.shadowBlur = 4;
                }
              } else {
                ctx.fillStyle = `rgba(16, 185, 129, ${alpha})`;
                ctx.shadowBlur = 0;
              }

              ctx.fill();
            }
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
          window.removeEventListener('touchmove', handleTouchMove);
          window.removeEventListener('touchend', handleMouseLeave);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="pointer-events-none fixed inset-0 z-0 h-full w-full opacity-70"
        />
      );
    };

      const cardRef = useRef(null);
      const [transformStyle, setTransformStyle] = useState('perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)');
      const [shine, setShine] = useState({ x: 0, y: 0, opacity: 0 });
      const [isHovered, setIsHovered] = useState(false);

      const handleMouseMove = (e) => {
        const card = cardRef.current;
        if (!card) return;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        const rotateX = ((y - centerY) / centerY) * -9;
        const rotateY = ((x - centerX) / centerX) * 9;

        setTransformStyle(`perspective(1000px) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg) translateY(-6px)`);
        setShine({ x, y, opacity: 1 });
      };

      const handleMouseEnter = () => {
        setIsHovered(true);
      };

      const handleMouseLeave = () => {
        setIsHovered(false);
        setTransformStyle('perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)');
        setShine((prev) => ({ ...prev, opacity: 0 }));
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseEnter={handleMouseEnter}
          onMouseLeave={handleMouseLeave}
          style={{
            transform: transformStyle,
            transition: isHovered
              ? 'transform 0.1s ease-out, box-shadow 0.3s ease, border-color 0.3s ease'

    // --- Subtle Custom Cursor Follower & Trailing Spark (Easter Egg) ---
    const CursorGlow = () => {
      const [visible, setVisible] = useState(false);
      const dotRef = useRef(null);
      const ringRef = useRef(null);

      useEffect(() => {
        if (!window.matchMedia('(pointer: fine)').matches) return;

        let targetX = -100;
        let targetY = -100;
        let currentX = -100;
        let currentY = -100;
        let animationFrameId;

        const handleMouseMove = (e) => {
          targetX = e.clientX;
          targetY = e.clientY;
          if (!visible) setVisible(true);
        };

        const handleMouseLeave = () => setVisible(false);
        const handleMouseEnter = () => setVisible(true);

        window.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseleave', handleMouseLeave);
        document.addEventListener('mouseenter', handleMouseEnter);

        const animate = () => {
          currentX += (targetX - currentX) * 0.18;
          currentY += (targetY - currentY) * 0.18;

          if (dotRef.current) {
            dotRef.current.style.transform = `translate3d(${targetX - 4}px, ${targetY - 4}px, 0)`;
          }
          if (ringRef.current) {
            ringRef.current.style.transform = `translate3d(${currentX - 20}px, ${currentY - 20}px, 0)`;
          }

          animationFrameId = requestAnimationFrame(animate);
        };

        animationFrameId = requestAnimationFrame(animate);

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseleave', handleMouseLeave);
          document.removeEventListener('mouseenter', handleMouseEnter);
          cancelAnimationFrame(animationFrameId);
        };
      }, [visible]);

      return (
        <React.Fragment>
          <div
            ref={ringRef}
            aria-hidden="true"
            className={`pointer-events-none fixed top-0 left-0 z-50 w-10 h-10 rounded-full border border-emerald-400/30 bg-emerald-500/5 backdrop-blur-[1px] shadow-[0_0_20px_rgba(16,185,129,0.35)] transition-opacity duration-300 ${
              visible ? 'opacity-100' : 'opacity-0'
            }`}
            style={{ willChange: 'transform' }}
          />
          <div
            ref={dotRef}
            aria-hidden="true"
            className={`pointer-events-none fixed top-0 left-0 z-50 w-2 h-2 rounded-full bg-lime-400 shadow-[0_0_10px_#a3e635,0_0_4px_#10b981] transition-opacity duration-200 ${

    const MagneticLink = ({ href, icon, label, subtext, isExternal = true }) => {
      const btnRef = useRef(null);
      const [offset, setOffset] = useState({ x: 0, y: 0 });

      const handleMouseMove = (e) => {
        const btn = btnRef.current;
        if (!btn) return;
        const rect = btn.getBoundingClientRect();
        const deltaX = (e.clientX - (rect.left + rect.width / 2)) * 0.32;
        const deltaY = (e.clientY - (rect.top + rect.height / 2)) * 0.32;
        setOffset({ x: deltaX, y: deltaY });
      };

      const handleMouseLeave = () => setOffset({ x: 0, y: 0 });

      return (
        <a
          ref={btnRef}
          href={href}
          target={isExternal ? '_blank' : undefined}
          rel={isExternal ? 'noopener noreferrer' : undefined}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          style={{
            transform: `translate3d(${offset.x}px, ${offset.y}px, 0)`,
